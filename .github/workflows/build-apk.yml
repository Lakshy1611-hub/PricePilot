name: Build PricePilot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Clean previous build outputs
        run: gradle clean --stacktrace

      - name: Build installable debug APK
        env:
          PRICE_API_BASE_URL: https://pricepilot-api-a7mx.onrender.com
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate APK package and signature
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "Validating: $APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          unzip -t "$APK" >/dev/null

      - name: Rename APK for download
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          cp "$APK" PricePilot-v1.1.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: PricePilot-v1.1-installable-apk
          path: PricePilot-v1.1.apk
          if-no-files-found: error
